<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#edf4fb" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0d0d'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%23ff5a36'/%3E%3Crect x='9' y='4' width='3' height='3' fill='%23777b76'/%3E%3Crect x='4' y='9' width='3' height='3' fill='%23777b76'/%3E%3Crect x='9' y='9' width='3' height='3' fill='%23ff5a36'/%3E%3C/svg%3E" />
    <title>Signal lost | nanbloom001</title>
    <script defer src="assets/starfield.js"></script>
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <span class="calibration calibration-nw" aria-hidden="true"></span>
    <span class="calibration calibration-se" aria-hidden="true"></span>

    <main class="frame">
      <p class="eyebrow"><span>404</span><span class="dim">// SIGNAL LOST</span></p>
      <h1>That route has no trajectory.</h1>
      <span class="rule" aria-hidden="true"></span>
      <p class="lede">The telemetry can't find this coordinate. Return to a known channel.</p>
      <a class="channel" href="/">
        <span class="ch-name">RETURN TO LANDING -&gt;</span>
      </a>
    </main>

    <style>
      :root {
        color-scheme: dark light;
        --bg: #0c0d0d; --ink: #e8e9e4; --muted: #777b76; --line: #292c29; --accent: #ff5a36;
        --pixel-ghost: #5d4138; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sans: Arial, sans-serif;
      }
      @media (prefers-color-scheme: light) { :root { --bg: #edf4fb; --ink: #10233f; --muted: #667991; --line: #cfdae7; --accent: #1769e0; --pixel-ghost: #a8c3e3; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: var(--sans); padding: env(safe-area-inset); }
      #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; contain: strict; }
      .calibration { position: fixed; width: 11px; height: 11px; z-index: 2; pointer-events: none; opacity: .85; }
      .calibration-nw { top: 8px; left: 8px; border-top: 1px solid var(--accent); border-left: 1px solid var(--accent); }
      .calibration-se { right: 8px; bottom: 8px; border-right: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
      .frame { position: relative; z-index: 1; width: min(560px, calc(100% - 48px)); }
      .eyebrow { display: flex; gap: 8px; margin: 0 0 16px; color: var(--accent); font: 700 10px var(--mono); letter-spacing: .08em; }
      .eyebrow .dim { color: var(--muted); }
      h1 { margin: 0; font: 700 clamp(28px, 6vw, 44px)/1.1 var(--mono); letter-spacing: .02em; }
      .rule { display: block; width: 40px; height: 1px; margin: 16px 0; background: var(--accent); }
      .lede { margin: 0 0 28px; color: var(--muted); font-size: 14px; line-height: 1.9; }
      .channel { position: relative; display: inline-block; padding: 14px 20px; border: 1px solid var(--ink); color: var(--ink); text-decoration: none; font: 700 12px var(--mono); letter-spacing: .1em; }
      .channel::before, .channel::after { content: ""; position: absolute; width: 7px; height: 7px; background: var(--bg); }
      .channel::before { top: -2px; left: -2px; }
      .channel::after { right: -2px; bottom: -2px; }
      .channel:hover { color: var(--accent); border-color: var(--accent); }
    </style>

    <script>
      (() => {
        function ink() { return getComputedStyle(document.documentElement).getPropertyValue("--ink").trim(); }
        function paint() { if (window.Starfield) window.Starfield.paint(document.getElementById("starfield"), ink()); }
        addEventListener("resize", paint, { passive: true });
        matchMedia("(prefers-color-scheme: light)").addEventListener("change", paint);
        paint();
      })();
    </script>
  </body>
</html>
