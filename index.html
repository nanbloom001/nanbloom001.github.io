<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="nanbloom001 — robotics, reinforcement learning, and AI-native engineering. Landing." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#edf4fb" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c0d0d'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%23ff5a36'/%3E%3Crect x='9' y='4' width='3' height='3' fill='%23777b76'/%3E%3Crect x='4' y='9' width='3' height='3' fill='%23777b76'/%3E%3Crect x='9' y='9' width='3' height='3' fill='%23ff5a36'/%3E%3C/svg%3E" />
    <title>nanbloom001</title>
    <script defer src="assets/dot-font.js"></script>
    <script defer src="assets/starfield.js"></script>
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <span class="calibration calibration-nw" aria-hidden="true"></span>
    <span class="calibration calibration-ne" aria-hidden="true"></span>
    <span class="calibration calibration-sw" aria-hidden="true"></span>
    <span class="calibration calibration-se" aria-hidden="true"></span>

    <main class="frame">
      <p class="eyebrow"><span>LANDING</span><span class="dim">// MISSION CONTROL</span></p>
      <div class="banner"><canvas id="wordmark" data-text="NAN" aria-hidden="true"></canvas></div>
      <span class="rule" aria-hidden="true"></span>
      <p class="lede">Robotics, reinforcement learning, and AI-native engineering.<br />Pick a channel to proceed.</p>

      <nav class="channels" aria-label="Channels">
        <a class="channel" href="blog/">
          <span class="ch-index">01</span>
          <span class="ch-name">FIELD LOG</span>
          <span class="ch-sub">实践日志 · BLOG</span>
        </a>
        <a class="channel" href="journey-archive/">
          <span class="ch-index">02</span>
          <span class="ch-name">LIFE ARCHIVE</span>
          <span class="ch-sub">人生档案 · 17 NODES</span>
        </a>
        <a class="channel" href="https://github.com/nanbloom001" target="_blank" rel="noreferrer">
          <span class="ch-index">03</span>
          <span class="ch-name">GITHUB</span>
          <span class="ch-sub">SOURCE -&gt;</span>
        </a>
      </nav>

      <div class="telemetry" aria-hidden="true">
        <span><i class="sq"></i>OPERATOR NAN &middot; ON DUTY</span>
        <span class="link"><i class="dot"></i>LINK STABLE</span>
      </div>
    </main>

    <style>
      :root {
        color-scheme: dark light;
        --bg: #0c0d0d; --panel: #111212; --ink: #e8e9e4; --muted: #777b76;
        --line: #292c29; --accent: #ff5a36; --selected: #0c0d0d; --pixel-ghost: #5d4138;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: Arial, "PingFang SC", sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #edf4fb; --panel: #fbfdff; --ink: #10233f; --muted: #667991; --line: #cfdae7; --accent: #1769e0; --selected: #fff; --pixel-ghost: #a8c3e3; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: var(--bg); color: var(--ink); font-family: var(--sans);
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        transition: background-color 250ms, color 250ms;
      }
      @media (prefers-color-scheme: dark) {
        body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgb(255 255 255 / 1.4%) 0 1px, transparent 1px 3px); }
      }
      #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; contain: strict; }
      .calibration { position: fixed; width: 11px; height: 11px; z-index: 2; pointer-events: none; opacity: .85; }
      .calibration-nw { top: 8px; left: 8px; border-top: 1px solid var(--accent); border-left: 1px solid var(--accent); }
      .calibration-ne { top: 8px; right: 8px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); }
      .calibration-sw { bottom: 8px; left: 8px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
      .calibration-se { right: 8px; bottom: 8px; border-right: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
      .frame { position: relative; z-index: 1; width: min(640px, calc(100% - 48px)); }
      .eyebrow { display: flex; gap: 8px; margin: 0 0 16px; color: var(--accent); font: 700 10px var(--mono); letter-spacing: .08em; }
      .eyebrow .dim { color: var(--muted); }
      .banner { width: 100%; height: clamp(90px, 18vw, 140px); margin: 0 0 4px; }
      .banner canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; contain: strict; }
      .rule { display: block; width: 40px; height: 1px; margin: 12px 0 16px; background: var(--accent); }
      .lede { margin: 0 0 32px; max-width: 48ch; color: var(--muted); font-size: 14px; line-height: 1.9; }
      .channels { display: grid; gap: 12px; margin-bottom: 28px; }
      .channel {
        position: relative; display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 16px;
        padding: 16px 18px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
        text-decoration: none; transition: background-color 140ms, border-color 140ms, transform 140ms;
      }
      .channel::before, .channel::after { content: ""; position: absolute; width: 7px; height: 7px; background: var(--bg); }
      .channel::before { top: -2px; left: -2px; }
      .channel::after { right: -2px; bottom: -2px; }
      .channel:hover, .channel:focus-visible { border-color: var(--accent); transform: translate(2px, -2px); outline: none; }
      .ch-index { color: var(--accent); font: 700 11px var(--mono); letter-spacing: .1em; }
      .ch-name { color: var(--ink); font: 700 14px var(--mono); letter-spacing: .1em; }
      .ch-sub { color: var(--muted); font: 400 12px var(--sans); }
      .telemetry { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font: 700 9px var(--mono); letter-spacing: .12em; }
      .telemetry > span { display: inline-flex; align-items: center; gap: 7px; }
      .telemetry .link { margin-left: auto; color: var(--accent); }
      .sq { width: 4px; height: 4px; background: var(--pixel-ghost); }
      .dot { width: 4px; height: 4px; background: var(--accent); animation: blink 900ms steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>

    <script>
      (() => {
        const reduced = matchMedia("(prefers-reduced-motion: reduce)");
        const light = matchMedia("(prefers-color-scheme: light)");
        function inkColor() {
          return getComputedStyle(document.documentElement).getPropertyValue("--ink").trim();
        }
        function paintStars() {
          if (window.Starfield) window.Starfield.paint(document.getElementById("starfield"), inkColor());
        }
        addEventListener("resize", paintStars, { passive: true });
        light.addEventListener("change", paintStars);
        paintStars();

        function paintWord() {
          if (!window.DotFont) return;
          const canvas = document.getElementById("wordmark");
          const bounds = canvas.getBoundingClientRect();
          if (!bounds.width) return;
          const ratio = Math.min(devicePixelRatio || 1, 2);
          canvas.width = Math.round(bounds.width * ratio);
          canvas.height = Math.round(bounds.height * ratio);
          const ctx = canvas.getContext("2d");
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          const result = DotFont.makeBlockPoints(
            canvas.dataset.text || "NAN",
            { cols: 7, rows: 9, maxPitch: 14 },
            { width: bounds.width, height: bounds.height }
          );
          const size = Math.max(3, Math.round(result.pitch * 0.8));
          ctx.clearRect(0, 0, bounds.width, bounds.height);
          ctx.fillStyle = inkColor();
          result.points.forEach((p) => ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size));
        }
        new ResizeObserver(paintWord).observe(document.getElementById("wordmark"));
        light.addEventListener("change", paintWord);
        document.fonts && document.fonts.ready.then(paintWord);
        setTimeout(paintWord, 100);
      })();
    </script>
  </body>
</html>
